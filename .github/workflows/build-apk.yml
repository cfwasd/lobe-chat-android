name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build LobeChat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Frontend Assets
        run: |
          npm install
          # 方案 A (纯离线秒开)：如果有完整前端源码并配置了静态导出
          # npm run build 
          
          # 方案 B (轻量壳模式)：如果暂无全量静态包，直接让 Capacitor 指向远程
          # 确保根目录存在合法的 capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "vip.wangziheng.lobechat",
            "appName": "LobeChat",
            "webDir": "out",
            "server": {
              "url": "https://chat.wangziheng.vip",
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="background:#000;"></body></html>' > out/index.html

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android Permissions & Build Settings
        run: |
          # 1. 显式锁定纯 64 位 ARM 芯片架构
          GRADLE_FILE="android/app/build.gradle"
          sed -i '/defaultConfig {/a \        ndk {\n            abiFilters "arm64-v8a"\n        }' $GRADLE_FILE

          # 2. 注入网络权限与明文传输放行
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST

          # 3. 动态定位并重写 MainActivity.java
          MAIN_ACTIVITY=$(find android/app/src/main/java/ -name "MainActivity.java" | head -n 1)
          PACKAGE_NAME=$(grep "^package " "$MAIN_ACTIVITY" | head -n 1)

          cat << EOF > "$MAIN_ACTIVITY"
          $PACKAGE_NAME

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      WebView webView = this.getBridge().getWebView();
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setUseWideViewPort(true);
                      settings.setLoadWithOverviewMode(true);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Sign APK with apksigner (v2/v3 support)
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK: $RAW_APK"

          keytool -genkeypair -v -keystore release.keystore -alias lobechat -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=LobeChat, OU=App, O=Lobe, L=SH, ST=SH, C=CN"

          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # 4 字节对齐
          $BUILD_TOOLS_PATH/zipalign -v -p 4 "$RAW_APK" aligned.apk

          # 签名
          $BUILD_TOOLS_PATH/apksigner sign --ks release.keystore --ks-key-alias lobechat --ks-pass pass:123456 --key-pass pass:123456 --out final-lobechat.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LobeChat-ARM64-APK
          path: final-lobechat.apk
