name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build LobeChat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>LobeChat</title></head><body><script>window.location.href="https://chat.wangziheng.vip";</script></body></html>' > out/index.html
          npm install

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Inject Background & Network Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Sign APK with Keystore
        run: |
          # 查找生成的 apk
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          
          # 创建一个标准签名密钥
          keytool -genkeypair -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass 123456 -keypass 123456 -dname "CN=LobeChat, OU=App, O=Lobe, L=SH, ST=SH, C=CN"
          
          # 使用 jarsigner 签名
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore my-release-key.jks -storepass 123456 -keypass 123456 $APK_PATH my-alias
          
          # 移动重命名
          mkdir -p final_apk
          cp $APK_PATH final_apk/LobeChat-WangZiHeng.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LobeChat-WangZiHeng-Signed-APK
          path: final_apk/LobeChat-WangZiHeng.apk
