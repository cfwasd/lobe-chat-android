name: Build LobeChat Android APK (Offline Assets)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Offline LobeChat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Pull Full Static Assets from VPS
        run: |
          mkdir -p out
          cd out

          # 1. 递归镜像抓取搬瓦工站点上的全量前端静态资源 (_next 目录、静态文件、favicon 等)
          wget -q -r -np -nH --cut-dirs=0 \
            --reject="html" \
            https://chat.wangziheng.vip/_next/ || true

          # 2. 抓取首页 HTML 并重命名为 index.html
          curl -sL https://chat.wangziheng.vip -o index.html

          # 3. 将 HTML 中绝对路径的 _next 替换为相对路径，确保本地 WebView (file:/// 或 http://localhost) 能精准命中
          sed -i 's|/_next/|_next/|g' index.html

          cd ..
          echo "=== 静态资源抓取完成，当前资源大小： ==="
          du -sh out/

      - name: Setup Capacitor Configuration
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # 配置纯本地模式，不设置 server.url，完全从本地 webDir 加载
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "vip.wangziheng.lobechat",
            "appName": "LobeChat",
            "webDir": "out",
            "server": {
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android Platform & Sync Assets
        run: |
          npx cap add android
          # 同步 out 目录里的完整静态文件到 Android assets 中
          npx cap sync android

      - name: Configure Android Permissions & WebView Settings
        run: |
          # 1. 锁定 arm64-v8a 架构
          GRADLE_FILE="android/app/build.gradle"
          sed -i '/defaultConfig {/a \        ndk {\n            abiFilters "arm64-v8a"\n        }' $GRADLE_FILE

          # 2. 注入权限与明文传输支持
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST

          # 3. 配置 MainActivity 开启 DOM Storage、数据库和跨域混合加载
          MAIN_ACTIVITY=$(find android/app/src/main/java/ -name "MainActivity.java" | head -n 1)
          PACKAGE_NAME=$(grep "^package " "$MAIN_ACTIVITY" | head -n 1)

          cat << EOF > "$MAIN_ACTIVITY"
          $PACKAGE_NAME

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      WebView webView = this.getBridge().getWebView();
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setUseWideViewPort(true);
                      settings.setLoadWithOverviewMode(true);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Sign APK with apksigner
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK: $RAW_APK"

          keytool -genkeypair -v -keystore release.keystore -alias lobechat -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=LobeChat, OU=App, O=Lobe, L=SH, ST=SH, C=CN"

          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          $BUILD_TOOLS_PATH/zipalign -v -p 4 "$RAW_APK" aligned.apk
          $BUILD_TOOLS_PATH/apksigner sign --ks release.keystore --ks-key-alias lobechat --ks-pass pass:123456 --key-pass pass:123456 --out final-lobechat.apk aligned.apk

          echo "=== 最终 APK 体积： ==="
          ls -lh final-lobechat.apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: LobeChat-Offline-ARM64-APK
          path: final-lobechat.apk
