name: Build Android APK (Release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build LobeChat Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Configuration
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="background:#000;"></body></html>' > out/index.html
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "vip.wangziheng.lobechat",
            "appName": "LobeChat",
            "webDir": "out",
            "server": {
              "url": "https://chat.wangziheng.vip",
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android Permissions, Caching & Build Settings
        run: |
          # 1. 显式锁定纯 64 位 ARM 架构
          GRADLE_FILE="android/app/build.gradle"
          sed -i '/defaultConfig {/a \        ndk {\n            abiFilters "arm64-v8a"\n        }' $GRADLE_FILE

          # 2. 注入权限与明文传输配置
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST

          # 3. 动态定位并重写 MainActivity.java (离线缓存、DOM 存储与持久化)
          MAIN_ACTIVITY=$(find android/app/src/main/java/ -name "MainActivity.java" | head -n 1)
          PACKAGE_NAME=$(grep "^package " "$MAIN_ACTIVITY" | head -n 1)

          cat << EOF > "$MAIN_ACTIVITY"
          $PACKAGE_NAME

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.CookieManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      WebView webView = this.getBridge().getWebView();
                      WebSettings settings = webView.getSettings();

                      // 核心渲染与运行配置
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setUseWideViewPort(true);
                      settings.setLoadWithOverviewMode(true);

                      // 激进本地缓存策略 (优先本地秒开)
                      settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);

                      // 跨域混合加载与 Cookie 保证
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      CookieManager cookieManager = CookieManager.getInstance();
                      cookieManager.setAcceptCookie(true);
                      cookieManager.setAcceptThirdPartyCookies(webView, true);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          # 编译正式 Release 产物
          ./gradlew assembleRelease --stacktrace

      - name: Align & Sign Release APK (v2/v3 Signature)
        run: |
          # 查找生成的 release 未签名 APK
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found Unsigned Release APK: $RAW_APK"

          # 生成 Release 签名密钥
          keytool -genkeypair -v -keystore release.keystore -alias lobechat \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=LobeChat, OU=Release, O=Lobe, L=SH, ST=SH, C=CN"

          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # 1. 4 字节边界对齐
          $BUILD_TOOLS_PATH/zipalign -v -p 4 "$RAW_APK" aligned-release.apk

          # 2. 执行正式发布签名 (启用 V2 + V3 签名机制)
          $BUILD_TOOLS_PATH/apksigner sign \
            --ks release.keystore \
            --ks-key-alias lobechat \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --out LobeChat-Release.apk aligned-release.apk

          # 3. 校验签名状态
          $BUILD_TOOLS_PATH/apksigner verify --verbose LobeChat-Release.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LobeChat-Release-ARM64
          path: LobeChat-Release.apk
