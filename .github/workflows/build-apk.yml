name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build LobeChat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>LobeChat</title></head><body><script>window.location.href="https://chat.wangziheng.vip";</script></body></html>' > out/index.html
          npm install

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Inject Background Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK with Android apksigner (v2/v3 support)
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK: $RAW_APK"

          # 生成标准安卓签名密钥
          keytool -genkeypair -v -keystore release.keystore -alias lobechat -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=LobeChat, OU=App, O=Lobe, L=SH, ST=SH, C=CN"

          # 找到 Android SDK 里的 build-tools 工具链 (zipalign & apksigner)
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using build tools from: $BUILD_TOOLS_PATH"

          # 1. 4字节对齐 (zipalign)
          $BUILD_TOOLS_PATH/zipalign -v -p 4 "$RAW_APK" aligned.apk

          # 2. 官方 apksigner 签名 (启用 v2, v3 签名，任何手机都能秒识别)
          $BUILD_TOOLS_PATH/apksigner sign --ks release.keystore --ks-key-alias lobechat --ks-pass pass:123456 --key-pass pass:123456 --out final-lobechat.apk aligned.apk

          # 3. 验证签名有效性
          $BUILD_TOOLS_PATH/apksigner verify --verbose final-lobechat.apk

      - name: Upload Valid Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LobeChat-WangZiHeng-Valid-APK
          path: final-lobechat.apk
